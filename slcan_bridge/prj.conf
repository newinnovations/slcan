CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
# Without this the driver rejects all incoming RTR frames
CONFIG_CAN_ACCEPT_RTR=y
# Send frames in the order the host queued them. The default Tx Queue sends the
# lowest pending ID first and same-ID frames in unpredictable order.
CONFIG_CAN_MCAN_TX_FIFO=y
CONFIG_SERIAL=y
# DMA-based UART: interrupt-driven RX loses bytes at 1 Mbaud (USART2 of the C092RC has no RX FIFO)
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_POLL=y
CONFIG_RING_BUFFER=y

# Fault on main-thread stack overflow instead of silently corrupting RAM
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y

# Disable boot banners and logs so stdout/USART2 stays pure SLCAN ASCII
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
